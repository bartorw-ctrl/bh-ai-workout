name: BHAIWorkout
options:
  bundleIdPrefix: com.bartorw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Core:
    path: Core
targets:
  BHAIWorkout:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Core
      - sdk: HealthKit.framework
    entitlements:
      path: App/BHAIWorkout.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BH AI Workout
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - healthkit
        NSHealthShareUsageDescription: BH AI Workout does not read your health data.
        NSHealthUpdateUsageDescription: BH AI Workout saves your finished workouts to Apple Health.
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartorw.bhaiworkout
        PRODUCT_NAME: BHAIWorkout
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
schemes:
  BHAIWorkout:
    build:
      targets:
        BHAIWorkout: all
    run:
      config: Debug
